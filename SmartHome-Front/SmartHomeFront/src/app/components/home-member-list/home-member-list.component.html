<div class="card home-member-list mx-auto mt-5 shadow-sm" style="max-width: 800px;">
  <div class="card-body">
    <h1 class="card-title text-center mb-4">Homes</h1>
    <div *ngIf="!selectedHome">
      <div *ngFor="let home of homes" class="home-item mb-3">
        <button class="btn btn-light w-100 text-start py-3 d-flex justify-content-between align-items-center border border-light shadow-sm" (click)="onSelectHome(home)">
          <div>
            <h2 class="h5 mb-1 text-dark">{{ home.homeAlias }}</h2>
            <p class="mb-0 text-muted">My Permissions: {{ home.permissions ? home.permissions.join(', ') : 'No permissions' }}</p>
          </div>
          <i class="bi bi-chevron-right text-dark"></i>
        </button>
      </div>
    </div>
    <div *ngIf="selectedHome">
      <button class="btn btn-secondary mb-3" (click)="onDeselectHome()">Go Back</button>
      <h2 class="h4 mb-3">{{ selectedHome.homeAlias }}</h2>
      <div *ngFor="let member of homeMembers" class="mb-2">
        <app-home-member-list-item [member]="member"></app-home-member-list-item>
      </div>
    </div>
  </div>
</div>
