<div class="member-notifications-configuration-item-container">
    <div class="member-data">
        <h3>{{ member.memberFullName }}</h3>
        <p>{{ member.memberEmail }}</p>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="indoor" [checked]="notificationsEnabled" (change)="onNotificationChange($event)">
            <label class="form-check-label">
                Receive Notifications
            </label>
        </div>
    </div>
    <div class="member-profile-photo">
        <img class="member-profile-photo" [src]="member.memberProfilePicture" alt="{{ member.memberFullName }}" />
    </div>
</div>
