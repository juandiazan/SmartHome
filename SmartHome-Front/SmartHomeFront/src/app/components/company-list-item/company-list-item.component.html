<div class="card mb-3 shadow-sm company-list-item">
    <div class="card-body">
      <h3 class="card-title mb-2"> <b> Company: </b> {{ company.companyName }}</h3>
      <p class="mb-1"><strong>Full name of owner:</strong> {{ company.ownerFullName }}</p>
      <p class="mb-1"><strong>Email of owner:</strong> {{ company.ownerEmail }}</p>
      <p class="mb-0"><strong>RUT:</strong> {{ company.companyRut }}</p>
    </div>
  </div>
